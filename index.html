<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZRG AR-VAULT PRO</title>
<!-- محرك الذكاء الاصطناعي البصري الحقيقي -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<style>
  :root { --gold: #D4AF37; --bg: #070709; --panel: rgba(14, 14, 18, 0.92); }
  * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body { margin: 0; background: var(--bg); color: #fff; overflow: hidden; height: 100vh; user-select: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  canvas { display: none; }

  .aim-box {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%);
    width: 210px; height: 210px; border: 1.5px dashed rgba(212, 175, 55, 0.5);
    border-radius: 22px; z-index: 2; pointer-events: none; transition: 0.25s;
  }

  /* المجلد العائم في الواقع المعزز */
  .ar-floating-folder {
    position: fixed; top: 42%; left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    z-index: 5; display: none; flex-direction: column; align-items: center;
    cursor: pointer; animation: floatGlow 2s infinite ease-in-out;
  }
  .ar-floating-folder.visible { display: flex; transform: translate(-50%, -50%) scale(1); }
  @keyframes floatGlow {
    0%, 100% { filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.75)); }
    50% { filter: drop-shadow(0 0 28px rgba(212, 175, 55, 1)); }
  }
  .folder-icon-wrap {
    position: relative; width: 96px; height: 82px;
    background: linear-gradient(145deg, #f3d066, #b88c1e);
    border-radius: 14px; display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff3c4; box-shadow: 0 12px 30px rgba(0,0,0,0.8);
  }
  .folder-tab {
    position: absolute; top: -10px; right: 10px; width: 38px; height: 14px;
    background: #d4af37; border-radius: 8px 8px 0 0;
  }
  .lock-badge {
    position: absolute; bottom: -10px; left: -10px; width: 38px; height: 38px;
    background: #111116; border: 2px solid var(--gold); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
  .ar-label {
    margin-top: 14px; background: rgba(10, 10, 14, 0.9); border: 1px solid var(--gold);
    color: var(--gold); padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
  }

  .top-bar {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 4;
    background: var(--panel); border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 16px; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center;
  }
  .brand { color: var(--gold); font-weight: 800; font-size: 14px; }
  .pill { background: #181820; border: 1px solid #4a3d14; color: var(--gold); padding: 4px 10px; border-radius: 14px; font-size: 12px; }

  .controls {
    position: fixed; bottom: 14px; left: 14px; right: 14px; z-index: 4;
    background: var(--panel); border: 1px solid rgba(212, 175, 55, 0.3);
    border-radius: 20px; padding: 14px;
  }
  .status-text { text-align: center; font-size: 13px; color: #e2e2e2; margin-bottom: 10px; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button, .file-label {
    border: none; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center;
  }
  .file-label { background: #22222c; color: #fff; border: 1px solid #3c3c4c; display: block; }
  .btn-gold { background: linear-gradient(135deg, #D4AF37, #A87E18); color: #000; }

  /* نافذة طلب بطاقة التعريف الوطنية */
  .nfc-prompt-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 9;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .nfc-card-box {
    background: #121217; border: 1.5px solid var(--gold); border-radius: 24px;
    padding: 24px; width: 100%; max-width: 340px; text-align: center;
  }
  .id-anim { font-size: 52px; margin: 14px 0; animation: pulseId 1.3s infinite; }
  @keyframes pulseId { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }

  /* عارض الملفات */
  .vault-modal {
    position: fixed; inset: 0; background: #070709; z-index: 10;
    display: none; flex-direction: column; padding: 16px;
  }
  .vault-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 10px; border-bottom: 1px solid rgba(212,175,55,0.3);
  }
  .vault-viewer {
    flex: 1; display: flex; align-items: center; justify-content: center;
    overflow: hidden; margin: 12px 0; background: #0e0e13; border-radius: 16px;
  }
  .vault-viewer img, .vault-viewer iframe { max-width: 100%; max-height: 100%; border: none; border-radius: 10px; }
  .vault-viewer iframe { width: 100%; height: 100%; }
  .vault-nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
  .btn-danger { background: #8b1111; color: #fff; padding: 8px 14px; }
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="aiCanvas" width="224" height="224"></canvas>
<div id="aimBox" class="aim-box"></div>

<!-- المجلد العائم فوق الهدف الحقيقي فقط -->
<div id="arFolder" class="ar-floating-folder" onclick="onFolderClicked()">
  <div class="folder-icon-wrap">
    <div class="folder-tab"></div>
    <span style="font-size: 38px;">📁</span>
    <div class="lock-badge">🔒</div>
  </div>
  <div id="arFolderLabel" class="ar-label">مجلد سري مقفل (اضغط للفتح)</div>
</div>

<div class="top-bar">
  <div class="brand">✦ ZRG AI-VAULT</div>
  <div id="scanStatus" class="pill">جاري تحميل AI...</div>
</div>

<div class="controls">
  <div id="statusMsg" class="status-text">انتظر تحميل محرك الذكاء الاصطناعي البصري...</div>
  <div class="btn-grid">
    <label class="file-label">
      1. اختر صور / PDF
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf" style="display:none" onchange="handleFiles(this.files)">
    </label>
    <button class="btn-gold" onclick="hideAtTarget()">2. ثبّت المجلد هنا</button>
  </div>
</div>

<!-- نافذة انتظار بطاقة التعريف الوطنية -->
<div id="nfcModal" class="nfc-prompt-modal">
  <div class="nfc-card-box">
    <div style="color:var(--gold); font-weight:800; font-size:17px;">التحقق ببطاقة التعريف الوطنية</div>
    <div class="id-anim">🪪</div>
    <div id="nfcPromptText" style="font-size:13px; color:#ccc; line-height:1.6; margin-bottom:16px;">
      ألصق بطاقة التعريف البيومترية بظهر الهاتف الآن لفتح قفل المجلد...
    </div>
    <button class="file-label" style="width:100%" onclick="closeNfcModal()">إلغاء</button>
  </div>
</div>

<!-- عارض الملفات -->
<div id="vaultModal" class="vault-modal">
  <div class="vault-header">
    <div style="color:var(--gold); font-weight:bold; font-size:14px;" id="vaultTitle">الخزنة المفتوحة</div>
    <button class="btn-danger" onclick="closeVault()">قفل وإخفاء ✕</button>
  </div>
  <div id="vaultViewer" class="vault-viewer"></div>
  <div class="vault-nav">
    <button class="file-label" style="width:30%" onclick="navVault(-1)">◀ السابق</button>
    <span id="itemCounter" style="font-size:13px; color:#bbb;">1 / 1</span>
    <button class="file-label" style="width:30%" onclick="navVault(1)">التالي ▶</button>
  </div>
</div>

<script>
const video = document.getElementById('cam');
const aiCanvas = document.getElementById('aiCanvas');
const ctx = aiCanvas.getContext('2d', { willReadFrequently: true });
const arFolder = document.getElementById('arFolder');
const arFolderLabel = document.getElementById('arFolderLabel');
const statusMsg = document.getElementById('statusMsg');
const scanStatus = document.getElementById('scanStatus');

let aiModel = null;
let selectedFiles = [];
let anchorData = null;
let vaultItems = [];
let currentIdx = 0;
let isVaultOpen = false;
let waitingForIdCard = false;

// دالة يستدعيها تطبيق الأندرويد مباشرة عند لمس بطاقة التعريف الوطنية (IsoDep / NfcA)
window.onAlgerianIdScanned = function(cardUidHex) {
  if (waitingForIdCard && anchorData) {
    if (navigator.vibrate) navigator.vibrate([100, 50, 150]);
    closeNfcModal();
    openVault(anchorData.items);
  }
};

async function initSystem() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }, audio: false
    });
    video.srcObject = stream;
  } catch (e) {
    statusMsg.textContent = "يرجى منح إذن الكاميرا للتطبيق";
    return;
  }

  // تحميل نموذج MobileNet لاستخراج البصمة العميقة للغرض/الزاوية
  aiModel = await mobilenet.load({ version: 2, alpha: 0.5 });
  scanStatus.textContent = "AI نشط ✔";
  statusMsg.textContent = "اختر الملفات ثم وجّه الكاميرا نحو الغرض أو الزاوية السرية";

  await loadSavedAnchor();
  setInterval(detectTargetLoop, 450);
}

// استخراج البصمة العميقة (1024 ميزة من MobileNet + طيف لوني)
async function getDeepEmbedding() {
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const size = Math.min(vw, vh) * 0.55;
  ctx.drawImage(video, (vw - size) / 2, (vh - size) / 2, size, size, 0, 0, 224, 224);

  // 1. متجه الميزات العميقة من الشبكة العصبية
  const embeddingTensor = aiModel.infer(aiCanvas, true);
  const embArray = Array.from(await embeddingTensor.data());
  embeddingTensor.dispose();

  // تطبيع المتجه
  let norm = 0;
  for (let i = 0; i < embArray.length; i++) norm += embArray[i] * embArray[i];
  norm = Math.sqrt(norm) || 1;
  for (let i = 0; i < embArray.length; i++) embArray[i] /= norm;

  // 2. بصمة الألوان لمنع التشابه مع أغراض مختلفة الشكل متطابقة الهيكل
  const img = ctx.getImageData(0, 0, 224, 224).data;
  const colorBins = new Float32Array(24);
  for (let i = 0; i < img.length; i += 64) {
    const r = img[i] / 255, g = img[i+1] / 255, b = img[i+2] / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
      else if (max === g) h = ((b - r) / d + 2) / 6;
      else h = ((r - g) / d + 4) / 6;
    }
    colorBins[Math.min(23, Math.floor(h * 24))]++;
  }
  let cNorm = 0;
  for (let i = 0; i < 24; i++) cNorm += colorBins[i] * colorBins[i];
  cNorm = Math.sqrt(cNorm) || 1;
  for (let i = 0; i < 24; i++) colorBins[i] /= cNorm;

  return { emb: embArray, col: Array.from(colorBins) };
}

function cosineSim(a, b) {
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return dot;
}

function handleFiles(files) {
  selectedFiles = Array.from(files);
  statusMsg.textContent = `تم اختيار ${selectedFiles.length} ملف. وجّه الكاميرا للهدف واضغط (2)`;
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("ZRG_AI_AR_VAULT_V2", 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains("vault")) db.createObjectStore("vault");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function hideAtTarget() {
  if (!selectedFiles.length) {
    alert("اختر صوراً أو ملفات PDF أولاً!");
    return;
  }
  if (!aiModel || video.readyState < 2) return;

  statusMsg.textContent = "جاري تحليل البصمة العميقة للهدف...";
  const sig = await getDeepEmbedding();

  const items = await Promise.all(selectedFiles.map(file => new Promise(res => {
    const r = new FileReader();
    r.onload = () => res({ name: file.name, type: file.type, data: r.result });
    r.readAsDataURL(file);
  })));

  const payload = { sig, items };
  const db = await openDB();
  const tx = db.transaction("vault", "readwrite");
  tx.objectStore("vault").put(payload, "deep_anchor");

  tx.oncomplete = () => {
    anchorData = payload;
    selectedFiles = [];
    arFolderLabel.textContent = `مجلد مقفل (${items.length} ملف) - اضغط للفتح`;
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
    statusMsg.textContent = "✔ تم قفل الملفات في هذا الهدف بدقة AI عالية!";
  };
}

async function loadSavedAnchor() {
  const db = await openDB();
  const tx = db.transaction("vault", "readonly");
  const req = tx.objectStore("vault").get("deep_anchor");
  req.onsuccess = () => {
    if (req.result) {
      anchorData = req.result;
      arFolderLabel.textContent = `مجلد مقفل (${anchorData.items.length} ملف) - اضغط للفتح`;
    }
  };
}

async function detectTargetLoop() {
  if (!anchorData || !aiModel || isVaultOpen || video.readyState < 2) return;

  const live = await getDeepEmbedding();
  const aiScore = cosineSim(anchorData.sig.emb, live.emb);
  const colScore = cosineSim(anchorData.sig.col, live.col);

  // الدمج الذكي: 75% ملامح الشبكة العصبية + 25% الطيف اللوني (يمنع الظهور الخاطئ في الأماكن الأخرى)
  const finalScore = (aiScore * 0.75) + (colScore * 0.25);
  const pct = Math.max(0, Math.round(finalScore * 100));
  scanStatus.textContent = `دقة المطابقة: ${pct}%`;

  // عتبة دقيقة (80% فما فوق) فلا يظهر المجلد إلا أمام الهدف الحقيقي
  if (finalScore >= 0.80) {
    arFolder.classList.add('visible');
    document.getElementById('aimBox').style.opacity = '0';
  } else {
    arFolder.classList.remove('visible');
    document.getElementById('aimBox').style.opacity = '1';
  }
}

function onFolderClicked() {
  if (!anchorData) return;
  if (navigator.vibrate) navigator.vibrate(60);
  waitingForIdCard = true;
  document.getElementById('nfcModal').style.display = 'flex';
}

function closeNfcModal() {
  waitingForIdCard = false;
  document.getElementById('nfcModal').style.display = 'none';
}

function openVault(items) {
  isVaultOpen = true;
  arFolder.classList.remove('visible');
  vaultItems = items;
  currentIdx = 0;
  document.getElementById('vaultModal').style.display = 'flex';
  renderVaultItem();
}

function renderVaultItem() {
  const item = vaultItems[currentIdx];
  const viewer = document.getElementById('vaultViewer');
  document.getElementById('vaultTitle').textContent = item.name;
  document.getElementById('itemCounter').textContent = `${currentIdx + 1} من ${vaultItems.length}`;
  if (item.type.includes('pdf')) {
    viewer.innerHTML = `<iframe src="${item.data}"></iframe>`;
  } else {
    viewer.innerHTML = `<img src="${item.data}" alt="secret">`;
  }
}

function navVault(dir) {
  currentIdx = (currentIdx + dir + vaultItems.length) % vaultItems.length;
  renderVaultItem();
}

function closeVault() {
  document.getElementById('vaultModal').style.display = 'none';
  document.getElementById('vaultViewer').innerHTML = '';
  isVaultOpen = false;
}

initSystem();
</script>
</body>
</html>
